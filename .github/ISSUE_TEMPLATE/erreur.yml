name: Signaler une erreur
description: Un fait inexact, une source mal lue, une information dépassée ou un lien mort.
title: "[Erreur] "
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page concernée
      description: L'adresse de la page ou le titre du dossier.
    validations:
      required: true
  - type: textarea
    id: passage
    attributes:
      label: Passage en cause
      description: Copiez la phrase ou le chiffre concerné.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Ce qui est inexact, et pourquoi
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Un lien vers un document qui établit la correction. Sans source, la correction ne peut pas être appliquée.
    validations:
      required: true
