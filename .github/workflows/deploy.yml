name: Publier le site

# Construit le site et le pousse sur la branche gh-pages, que GitHub Pages publie.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # La construction échoue si un dossier enfreint la charte (voir scripts/valider-dossiers.js).
      - name: Construire et indexer
        run: npm run build
        env:
          PATH_PREFIX: /diatribe/

      - name: Pousser sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Publication"
